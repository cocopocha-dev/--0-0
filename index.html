<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シングルページアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>シンプルタイマーアプリ</h1>
        <div id="timer-display">00:00</div>
        <form id="time-chooser">
            <label for="minutes">分:</label>
            <input type="number" id="minutes" min="0" max="99" value="0"><br>
            <label for="seconds">秒:</label>
            <input type="number" id="seconds" min="1" max="59" value="1">
        </form>
        <div class="controls">
            <button id="start-stop">スタート</button>
            <button id="reset">リセット</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
